<!doctype html>

<html>
  <head>
    <title>Simple Reactive Example with Vanilla JS</title>

    <style>
      .cell { display: block; }
    </style>
  </head>

  <body>
    <h1>Simple Reactive Example with Vanilla JS</h1>
    <main id="app-container">
      <input id="a0" class="cell" type="number" placeholder="A0">
      <input id="a1" class="cell" type="number" placeholder="A1">
      <input id="a2" class="cell" type="number" placeholder="A2">
      <input id="a3" class="cell" type="number" placeholder="A3" readonly> <!-- Should contain the sum of A0, A1, and A2 -->

      <p id="summary"></p>
    </main>

    <script type="module">
      const a0 = document.querySelector('#a0');
      const a1 = document.querySelector('#a1');
      const a2 = document.querySelector('#a2');
      const a3 = document.querySelector('#a3');
      const summary = document.querySelector('#summary');

      a0.value = 10;
      a1.value = 1;
      a2.value = 2;

      /**
       * Updates the value of a3 to be the sum of a0, a1, and a2.
       */
      function updateA3() {
        a3.value = Number(a0.value) + Number(a1.value) + Number(a2.value);
      }

      /**
       * Updates the summary paragraph to reflect the current value of a3.
       */
      function updateSummary() {
        summary.innerHTML = `The new value of <code>a3</code> is ${a3.value}.
        It was calculated by adding <code>a0</code>=${a0.value},
        <code>a1</code>=${a1.value}, and <code>a2</code>=${a2.value}`;
      }

      // React to input changes...

      a0.addEventListener('input', updateA3);
      a1.addEventListener('input', updateA3);
      a2.addEventListener('input', updateA3);

      a0.addEventListener('input', updateSummary);
      a1.addEventListener('input', updateSummary);
      a2.addEventListener('input', updateSummary);

      // Initialize the values...

      updateA3();
      updateSummary();
    </script>
  </body>
</html>
