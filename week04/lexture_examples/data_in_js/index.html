<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Working with Data in JavaScript</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main>
      <h1>Working with Data in JavaScript</h1>
      <p>This map shows the density of bikeshare stations in each neighborhood throughout Philadelphia. The <a href="https://www.rideindego.com/about/data/" target="_blank">bikeshare station data</a> comes from the Indego GBFS data feed, and the neighborhoods data comes from the <a href="https://opendataphilly.org/datasets/philadelphia-neighborhoods/" target="_blank">Philadelphia Neighborhoods dataset</a> on OpenDataPhilly.</p>
      <div id="map" class="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/@turf/turf@7.0.0/turf.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
